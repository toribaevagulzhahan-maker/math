<script>
const DATA={"areas":[{"id":"shop","title":"SMART SHOP","sub":"Ақша және тиімді таңдау","icon":"🛍️","color":"#ff736a","wash":"#fff0ee","pos":[19.5,25.5],"skill":"Ақша, баға, қайтарым"},{"id":"time","title":"TIME STATION","sub":"Уақыт пен жоспарлау","icon":"⏰","color":"#159bc7","wash":"#eaf8ff","pos":[49,20],"skill":"Сағат, минут, кесте"},{"id":"bank","title":"MATH BANK","sub":"Бюджет пен жинақ","icon":"🪙","color":"#15996f","wash":"#e8f9f0","pos":[81.5,25],"skill":"Кіріс, шығыс, жинақ"},{"id":"build","title":"BUILD HOUSE","sub":"Өлшеу және кеңістік","icon":"🏡","color":"#df8821","wash":"#fff4dd","pos":[17,53],"skill":"Аудан, периметр"},{"id":"route","title":"SMART ROUTE","sub":"Қашықтық пен бағыт","icon":"🗺️","color":"#3c74ea","wash":"#eaf1ff","pos":[82,53],"skill":"Маршрут, уақыт"},{"id":"data","title":"DATA PARK","sub":"Кесте мен диаграмма","icon":"📊","color":"#8165de","wash":"#f2edff","pos":[17,83],"skill":"Мәлімет пен талдау"},{"id":"logic","title":"LOGIC QUEST","sub":"Логика және ойлау","icon":"🧩","color":"#c650b4","wash":"#fff0fc","pos":[50,84],"skill":"Заңдылық, дәлел"},{"id":"progress","title":"MY PROGRESS","sub":"Жетістіктер картасы","icon":"🏆","color":"#e6a01f","wash":"#fff9e5","pos":[83,84],"skill":"Мониторинг, рефлексия"}],"missions":{"shop":[{"level":"A","title":"Алғашқы сатып алу","story":"Дүкенде 3 дәптер 120 теңгеден, 2 қалам 85 теңгеден сатылды. Сатып алушы 1000 теңге берді.","tasks":[{"q":"Барлық тауардың құны қанша теңге?","a":"530","hint":"Дәптерлер мен қаламдардың бағасын бөлек есептеп, қос.","why":"3 × 120 + 2 × 85 = 360 + 170 = 530 теңге.","type":"number","options":[],"unit":"теңге","id":"shop_A_1"},{"q":"1000 теңгеден қанша қайтарым беріледі?","a":"470","hint":"Төленген ақшадан барлық тауардың құнын азайт.","why":"1000 − 530 = 470 теңге.","type":"number","options":[],"unit":"теңге","id":"shop_A_2"}],"id":"shop_A"},{"level":"B","title":"Тиімді сатып алу","story":"4 блокнот 180 теңгеден және 2 сызғыш 250 теңгеден сатып алынды. Барлығы 1500 теңге бар.","tasks":[{"q":"Сатып алынған заттардың жалпы бағасы?","a":"1220","hint":"4 × 180 және 2 × 250 өрнектерін есепте.","why":"720 + 500 = 1220 теңге.","type":"number","options":[],"unit":"теңге","id":"shop_B_1"},{"q":"Сатып алғаннан кейін қанша теңге қалады?","a":"280","hint":"1500 теңгеден жұмсалған ақшаны азайт.","why":"1500 − 1220 = 280 теңге.","type":"number","options":[],"unit":"теңге","id":"shop_B_2"}],"id":"shop_B"},{"level":"C","title":"Саналы таңдау","story":"Бюджет – 1500 теңге. 5 дәптер 160 теңгеден, 4 қалам 120 теңгеден, 2 өшіргіш 90 теңгеден алынады. Кейін бір қалам 80 теңгелікке ауыстырылады.","tasks":[{"q":"Алғашқы сатып алудан қанша теңге қалады?","a":"40","hint":"Әр тауар түрінің құнын тауып, қос.","why":"5 × 160 + 4 × 120 + 2 × 90 = 1460; 1500 − 1460 = 40 теңге.","type":"number","options":[],"unit":"теңге","id":"shop_C_1"},{"q":"Бір қалам арзанына ауыстырылған соң қанша теңге қалады?","a":"80","hint":"Бір қаламның бағасы 40 теңгеге арзандайды.","why":"120 − 80 = 40 теңге үнем; бастапқы 40 + 40 = 80 теңге.","type":"number","options":[],"unit":"теңге","id":"shop_C_2"}],"id":"shop_C"}],"time":[{"level":"A","title":"Мектепке барар жол","story":"Айару 08:15-те үйден шықты. Мектепке жетуге 25 минут кетеді. Сабақ 09:00-де басталады.","tasks":[{"q":"Айару мектепке нешеде келеді? (сағ:мин)","a":"08:40","hint":"15 минутқа 25 минут қосып көр.","why":"08:15 + 25 минут = 08:40.","type":"time","options":[],"unit":"","id":"time_A_1"},{"q":"Сабаққа дейін қанша минут уақыты бар?","a":"20","hint":"09:00-ден келу уақытын азайт.","why":"09:00 − 08:40 = 20 минут.","type":"number","options":[],"unit":"минут","id":"time_A_2"}],"id":"time_A"},{"level":"B","title":"Мұражай уақыты","story":"Мұражайға саяхат сағат 10:35-те басталды және 1 сағат 45 минутқа созылды.","tasks":[{"q":"Саяхат нешеде аяқталады? (сағ:мин)","a":"12:20","hint":"Алдымен 1 сағат, содан кейін 45 минут қос.","why":"10:35 + 1:45 = 12:20.","type":"time","options":[],"unit":"","id":"time_B_1"},{"q":"Саяхат қанша минутқа созылды?","a":"105","hint":"1 сағатта 60 минут бар.","why":"60 + 45 = 105 минут.","type":"number","options":[],"unit":"минут","id":"time_B_2"}],"id":"time_B"},{"level":"C","title":"Саяхатты жоспарлау","story":"Саяхат 14:20-да басталды. Автобуспен бару – 35 минут, көрме – 50 минут, қайту – 35 минут.","tasks":[{"q":"Оқушылар нешеде қайтып келеді? (сағ:мин)","a":"16:20","hint":"Барлық уақытты қосып, 14:20-дан бастап сана.","why":"35 + 50 + 35 = 120 минут = 2 сағат; 14:20 + 2 сағат = 16:20.","type":"time","options":[],"unit":"","id":"time_C_1"},{"q":"Саяхаттың жалпы ұзақтығы қанша минут?","a":"120","hint":"Үш кезеңнің минуттарын қос.","why":"35 + 50 + 35 = 120 минут.","type":"number","options":[],"unit":"минут","id":"time_C_2"}],"id":"time_C"}],"bank":[{"level":"A","title":"Мереке бюджеті","story":"Қала мерекесіне 7000 теңге бөлінді. Безендіруге 2350 теңге, құралдарға 1850 теңге жұмсалды.","tasks":[{"q":"Жалпы шығын қанша теңге болды?","a":"4200","hint":"Екі шығынды қос.","why":"2350 + 1850 = 4200 теңге.","type":"number","options":[],"unit":"теңге","id":"bank_A_1"},{"q":"Қанша теңге қалды?","a":"2800","hint":"Бюджеттен жалпы шығынды азайт.","why":"7000 − 4200 = 2800 теңге.","type":"number","options":[],"unit":"теңге","id":"bank_A_2"}],"id":"bank_A"},{"level":"B","title":"Мақсатқа жинақтау","story":"Әли әр аптада 400 теңге жинайды. Ол 2800 теңге тұратын кітап сатып алғысы келеді.","tasks":[{"q":"Кітапқа жинау үшін неше апта қажет?","a":"7","hint":"2800-ді 400-ге бөл.","why":"2800 ÷ 400 = 7 апта.","type":"number","options":[],"unit":"апта","id":"bank_B_1"},{"q":"5 аптада Әли қанша теңге жинайды?","a":"2000","hint":"Бір апталық жинақты беске көбейт.","why":"5 × 400 = 2000 теңге.","type":"number","options":[],"unit":"теңге","id":"bank_B_2"}],"id":"bank_B"},{"level":"C","title":"Ортақ қаражат","story":"24 оқушының әрқайсысы 200 теңгеден қосты. Материалға 1600 теңге, сыйлыққа 2450 теңге кетеді. Безендірудің екі нұсқасы бар: 700 теңге немесе 900 теңге.","tasks":[{"q":"Материал мен сыйлықтан кейін қанша теңге қалады?","a":"750","hint":"Алдымен 24 × 200, кейін барлық негізгі шығын.","why":"24 × 200 = 4800; 1600 + 2450 = 4050; 4800 − 4050 = 750 теңге.","type":"number","options":[],"unit":"теңге","id":"bank_C_1"},{"q":"Қай безендіру нұсқасы бюджетке сай?","a":"700 теңге","hint":"Қалған 750 теңгені екі бағамен салыстыр.","why":"700 теңгелік безендіруге жетеді, 50 теңге қалады. 900 теңгелікке 150 теңге жетпейді.","type":"choice","options":["700 теңге","900 теңге","Екеуіне де жетеді","Екеуіне де жетпейді"],"unit":"","id":"bank_C_2"}],"id":"bank_C"}],"build":[{"level":"A","title":"Бөлмені жобалау","story":"Тік төртбұрыш пішінді бөлменің ұзындығы 7 метр, ені 4 метр.","tasks":[{"q":"Бөлменің ауданын тап (м²).","a":"28","hint":"Аудан = ұзындық × ен.","why":"7 × 4 = 28 м².","type":"number","options":[],"unit":"м²","id":"build_A_1"},{"q":"Бөлменің периметрін тап (м).","a":"22","hint":"Периметр = 2 × (ұзындық + ен).","why":"2 × (7 + 4) = 22 м.","type":"number","options":[],"unit":"м","id":"build_A_2"}],"id":"build_A"},{"level":"B","title":"Алаңды төсеу","story":"Ұзындығы 8 метр, ені 3 метр алаңды 1 м²-лік төсеммен жабу керек. Қосымша 2 төсем алынады.","tasks":[{"q":"Алаң ауданы қанша м²?","a":"24","hint":"8-ді 3-ке көбейт.","why":"8 × 3 = 24 м².","type":"number","options":[],"unit":"м²","id":"build_B_1"},{"q":"Қосымша төсеммен бірге барлығы неше төсем керек?","a":"26","hint":"Ауданға қосымша 2 төсемді қос.","why":"24 + 2 = 26 төсем.","type":"number","options":[],"unit":"төсем","id":"build_B_2"}],"id":"build_B"},{"level":"C","title":"Қоршау есебі","story":"12 м × 8 м ойын алаңының сыртын қоршау керек. Бір қоршау бөлігінің ұзындығы – 2 метр.","tasks":[{"q":"Алаңның периметрі неше метр?","a":"40","hint":"Тік төртбұрыштың төрт қабырғасын қос.","why":"2 × (12 + 8) = 40 м.","type":"number","options":[],"unit":"м","id":"build_C_1"},{"q":"Осы қоршауға неше бөлік керек?","a":"20","hint":"Периметрді бір бөліктің ұзындығына бөл.","why":"40 ÷ 2 = 20 const AREA=Object.fromEntries(DATA.areas.map(a=>[a.id,a]));
const N_QUESTIONS=Object.values(DATA.missions).flat().reduce((n,m)=>n+m.tasks.length,0);
const N_MISSIONS=Object.values(DATA.missions).reduce((n,m)=>n+m.length,0);
const STORAGE_KEY='math-city-kz-v1';
const blankProfile=()=>({progress:{},attempts:{},diag:{A:null,B:null},rubric:{},reflect:{},created:new Date().toISOString()});
let DB;
try{DB=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){DB=null}
if(!DB||!DB.profiles||!Object.keys(DB.profiles).length) DB={active:'O-01',profiles:{'O-01':blankProfile()}};
if(!DB.active||!DB.profiles[DB.active]) DB.active=Object.keys(DB.profiles)[0];
const S={view:'home',zone:'shop',level:'A',taskIndex:0,feedback:null,hint:false,selected:'',completion:false,diagCode:'A',diagKey:false,teacherTab:'guide'};
const $=id=>document.getElementById(id);
const profile=()=>DB.profiles[DB.active];
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(n,d)=>d?Math.round(n/d*100):0;
const doneTask=id=>Boolean(profile().progress?.[id]?.ok);
const completed=(p=profile())=>Object.values(p.progress||{}).filter(v=>v&&v.ok).length;
const earned=(p=profile())=>completed(p)*10;
const isDoneMission=m=>m.tasks.every(t=>doneTask(t.id));
const doneMissionCount=()=>Object.values(DATA.missions).flat().filter(isDoneMission).length;
const countForZone=id=>DATA.missions[id].flatMap(m=>m.tasks).filter(t=>doneTask(t.id)).length;
const totalForZone=id=>DATA.missions[id].reduce((n,m)=>n+m.tasks.length,0);
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));return true}catch(e){toast('Браузер деректерді сақтауға рұқсат бермеді. CSV көшірмесін сақтаңыз.');return false}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3400)}
function nav(v,scroll=true){S.view=v;S.feedback=null;S.hint=false;S.selected='';S.completion=false;render();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function openZone(z,l='A'){if(z==='progress'){nav('progress');return;}if(!DATA.missions[z])return;S.zone=z;S.level=l;S.taskIndex=firstOpen(z,l);nav('mission')}
function firstOpen(z,l){const m=DATA.missions[z].find(m=>m.level===l);return Math.max(0,m.tasks.findIndex(t=>!doneTask(t.id)))}
function currentMission(){return DATA.missions[S.zone].find(m=>m.level===S.level)}
function menu(){let bs=[['home','Қала картасы'],['mission','Миссиялар'],['diagnostic','Диагностика'],['progress','Жетістіктер'],['teacher','Мұғалімге']];return bs.map(([k,label])=>`<button type="button" class="navbtn ${S.view===k?'active':''}" data-action="nav" data-view="${k}">${label}</button>`).join('')}
function renderHeader(){

function home(){
 const progress=completed(), share=pct(progress,N_QUESTIONS);
 const hero=`<section class="hero"><div style="position:relative;z-index:1"><div class="eyebrow">✨ 4-СЫНЫП · ИНТЕРАКТИВТІ МАТЕМАТИКА</div><h1 class="hero-title">Математика <mark>қаласына</mark> қош келдің!</h1><p>Дүкенде есепте, банкте жоспарла, қаладан маршрут тап! Әр тапсырма – өмірге қажетті жаңа дағды. <strong>Өзіңнің математикалық қалаңды зертте.</strong></p><div class="hero-actions"><button class="btn btn-primary" data-action="start">🚀 Миссияны бастау</button><button class="btn btn-secondary" data-action="nav" data-view="progress">🏆 Менің жетістігім</button></div></div><div class="hero-side" aria-label="Жоба көрсеткіштері"><div class="hero-stat"><span class="stat-icon">🏙️</span><span class="num">7</span><small>қалалық аймақ</small></div><div class="hero-stat"><span class="stat-icon">🎯</span><span class="num">21</span><small>миссия</small></div><div class="hero-stat"><span class="stat-icon">🧠</span><span class="num">42</span><small>тапсырма</small></div><div class="hero-stat"><span class="stat-icon">⭐</span><span class="num">${earned()}</span><small>жинаған ұпай</small></div></div></section>`;
 const hot=DATA.areas.map(a=>`<button type="button" class="hotspot" style="left:${a.pos[0]}%;top:${a.pos[1]}%" title="${safe(a.title)} – ${safe(a.sub)}" aria-label="${safe(a.title)} бөлімін ашу" data-action="open-zone" data-zone="${a.id}"><span>${a.id==='progress'?'🏆':'↗'}</span><span class="hotspot-label">${safe(a.title)}</span></button>`).join('');
 const map=`<div><div class="section-head"><div><span class="eyetag">🗺️ ҚАЛА КАРТАСЫ</span><h2>Қаланы зертте</h2><p>Ғимарат белгішесін басып, өз миссияңа кір.</p></div><span class="tag">8 нысан</span></div><div class="city-card"><div class="city-map" style="background-image:url('${MAP_DATA}')" role="group" aria-label="MATH CITY интерактивті қала картасы">${hot}</div><div class="map-note">👆 Суреттегі дөңгелек белгілерді таңда немесе төмендегі бөлімдерді пайдалан.</div></div></div>`;
 const side=`<div class="side-stack"><div class="info-card"><h3>🏆 Сенің көрсеткішің</h3><div class="big-percent">${share}%</div><p class="small-muted">${progress} / ${N_QUESTIONS} тапсырма орындалды</p><div class="progress-track" style="margin:14px 0 12px"><div class="progress-fill" style="width:${share}%"></div></div><div class="hero-actions"><button class="btn btn-ghost btn-sm" data-action="nav" data-view="progress">Толық есеп →</button></div></div><div class="info-card"><h3>🧭 «ҚАЛА» алгоритмі</h3><div class="mini-steps"><div><span class="step-num">Қ</span> Қарастыр</div><div><span class="step-num">А</span> Анықта</div><div><span class="step-num">Л</span> Логикасын құр</div><div><span class="step-num">А</span> Ақиқатта</div></div><p class="small-muted" style="margin-top:14px">Әр есептің жауабын табумен ғана шектелме: шешу жолын түсіндір.</p></div></div>`;
 const cards=DATA.areas.map(a=>{let count=a.id==='progress'?completed():countForZone(a.id),total=a.id==='progress'?N_QUESTIONS:totalForZone(a.id);return `<button class="area-card ${a.id==='progress'?'trophy':''}" style="--wash:${a.wash};--area:${a.color}" data-action="open-zone" data-zone="${a.id}" aria-label="${safe(a.title)}"><div class="iconbox">${a.icon}</div><div class="title">${safe(a.title)}</div><div class="subtitle">${safe(a.sub)}</div><div class="area-footer"><span>${a.id==='progress'?'Жалпы жетістік':`${count} / ${total} тапсырма`}</span><span>${pct(count,total)}% →</span></div><div class="area-bar"><span style="width:${pct(count,total)}%"></span></div></button>`}).join('');

function zonePage(){
 const a=AREA[S.zone],m=currentMission(),t=m.tasks[S.taskIndex];const allDone=isDoneMission(m);const nDone=m.tasks.filter(t=>doneTask(t.id)).length;

 const completedBanner=(allDone&&S.completion)?`<div class="complete-card"><div class="big">🏆</div><h3>Тамаша! Миссия орындалды!</h3><p>«${safe(m.title)}» миссиясындағы екі тапсырма дұрыс шешілді. Жетістігің картаға тіркелді.</p><div class="hero-actions"><button class="btn btn-primary" data-action="next-level">Келесі деңгей →</button><button class="btn btn-outline" data-action="nav" data-view="progress">Жетістік картасы</button><button class="btn btn-muted" data-action="replay">Қайта қарау</button></div></div>`:'';
 const choices=t.type==='choice'?`<div class="choice-grid">${t.options.map(opt=>`<button type="button" class="choice ${S.selected===opt?'selected':''}" data-action="choice" data-value="${safe(opt)}">${safe(opt)}</button>`).join('')}</div>`:'';
 const field=t.type==='choice'?`<input type="hidden" id="answerInput" value="${safe(S.selected)}">`:`<input class="answer-input" id="answerInput" autocomplete="off" autocapitalize="none" inputmode="${t.type==='number'?'decimal':'text'}" placeholder="${t.type==='time'?'Мысалы: 08:40':'Жауабыңды жаз...'}" aria-label="Математикалық тапсырманың жауабы"><span class="unit-label">${safe(t.unit||'')}</span>`;
 const form=`<div class="question-top"><span class="question-num">${safe(a.title)} · ${safe(m.level)} деңгейі</span><div class="task-bubbles">${m.tasks.map((x,i)=>`<button type="button" title="${i+1}-тапсырма" class="task-dot ${doneTask(x.id)?'complete':''} ${i===S.taskIndex?'current':''}" data-action="task" data-index="${i}">${doneTask(x.id)?'✓':i+1}</button>`).join('')}</div></div><div class="question-title">${safe(t.q)}</div><form id="answerForm">${choices}<div class="answer-form">${field}<button type="submit" class="btn btn-primary" ${S.feedback?.kind==='correct'?'disabled':''}>✓ Тексеру</button></div></form><div class="question-footer"><button type="button" class="btn btn-muted btn-sm" data-action="hint">💡 Көмек</button><span class="small-muted">Әр дұрыс жауап: 10 ұпай</span></div>${S.hint?`<div class="hintbox">💡 ${safe(t.hint)}</div>`:''}${S.feedback?`<div class="feedback ${S.feedback.kind}"><h3>${S.feedback.kind==='correct'?'✅ Дұрыс жауап!':'🔎 Қайта ойланып көр'}</h3><p>${S.feedback.kind==='correct'?safe(t.why):'Шарттағы маңызды сандарды белгіле. «ҚАЛА» алгоритмін есіңе түсір.'}</p>${S.feedback.kind==='correct'?`<button class="btn btn-ghost btn-sm" data-action="next-task">${S.taskIndex===m.tasks.length-1?'Миссияны аяқтау 🏆':'Келесі тапсырма →'}</button>`:''}</div>`:''}`;
 return `<div class="container section"><div class="page-head"><div><div class="breadcrumb"><button data-action="nav" data-view="home">Қала картасы</button> › ${safe(a.title)}</div><h2 style="margin-top:9px">${safe(a.title)}</h2><p class="subline">${safe(a.sub)} · ${safe(a.skill)}</p></div><button class="btn btn-outline btn-sm" data-action="nav" data-view="home">← Картаға қайту</button></div><div class="zone-banner" style="--wash:${a.wash};--area:${a.color}"><div class="icon-large">${a.icon}</div><div><span class="tag orange">🎯 3 деңгей · 6 тапсырма</span><h2>${safe(a.sub)}</h2><p>Өзіңді сынап көр: дұрыс шешімге біртіндеп жет!</p></div></div><div class="content-grid"><div><div class="panel"><h3 style="margin-bottom:14px">Миссия деңгейін таңда</h3><div class="levels">${levels}</div><div class="story-box" style="--area:${a.color}"><strong>📍 МИССИЯ: ${safe(m.title)}</strong><p>${safe(m.story)}</p></div>${completedBanner||form}</div><div class="panel" style="margin-top:18px"><h3>📚 Нені үйренеміз?</h3><p style="margin-top:8px;color:#647d94">${safe(a.skill)}. Сандық жауапты ғана емес, неге осы амалды таңдағаныңды түсіндіруді үйрен.</p></div></div><aside class="side-stack"><div class="info-card"><h3>🧭 «ҚАЛА» алгоритмі</h3><div class="qalarow"><div class="qala-step"><b>Қ</b><span>Қарастыр – есепте не сұралған?</span></div><div class="qala-step"><b>А</b><span>Анықта – қандай деректер керек?</span></div><div class="qala-step"><b>Л</b><span>Логикасын құр – қай амал тиімді?</span></div><div class="qala-step"><b>А</b><span>Ақиқатта – жауабыңды тексер.</span></div></div></div><div class="info-card"><h3>⭐ Осы миссия</h3><div class="big-percent">${nDone} / 2</div><p class="small-muted">дұрыс тапсырма</p><div class="progress-track" style="margin-top:12px"><div class="progress-fill" style="width:${pct(nDone,2)}%"></div></div><p class="small-muted" style="margin-top:13px">Мақсат: екі сұраққа да дұрыс жауап беру.</p></div></aside></div></div>`;
}
function areaProgressBars(){return DATA.areas.filter(a=>a.id!=='progress').map(a=>{const n=countForZone(a.id);return `<div class="progress-list-item"><div class="pi">${a.icon}</div><div><strong style="font-size:.88rem">${a.title}</strong><small style="display:block">${safe(a.sub)}</small><div class="bar-shell"><span style="width:${pct(n,6)}%;background:${a.color}"></span></div></div><div class="progress-pct">${pct(n,6)}%</div></div>`}).join('')}
function progressPage(){

талап етілмейді. Нәтижені жоғалтпау үшін мұғалімге CSV файлын сақтап отыру ұсынылады.</div></div></div></div>`;

function diagnosticPage(){const d=DATA.diag.find(x=>x.code===S.diagCode), score=profile().diag?.[S.diagCode];const qs=d.qs.map((row,i)=>`<div class="diag-q"><span class="diag-n">${i+1}</span><div><strong>${safe(row[0])}</strong><p>${safe(row[1])}</p>${S.diagKey?`<div class="answer-key">Жауабы: ${safe(row[3])}</div>`:''}</div><span class="score-chip">${row[2]} балл</span></div>`).join('');return `<div class="container section"><div class="page-head"><div><span class="eyetag">📝 ТЕКСЕРУ ЖӘНЕ МОНИТОРИНГ</span><h2>Бастапқы және қорытынды диагностика</h2><p class="subline">Екі нұсқа, 8 тапсырма, әр нұсқада барлығы 20 балл</p></div><button class="btn btn-outline btn-sm" data-action="print-diag">🖨️ Тапсырманы басып шығару</button></div><div class="content-grid"><div><div class="panel"><div class="diag-switch">${DATA.diag.map(x=>`<button class="${S.diagCode===x.code?'active':''}" data-action="diag-switch" data-code="${x.code}">${x.code} · ${x.title}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px"><div><h3>${safe(d.title)}</h3><p class="small-muted">Математикалық әрекет пен түсіндіру дағдылары</p></div><button class="btn btn-muted btn-sm" data-action="diag-key">${S.diagKey?'Жауаптарды жасыру':'🔑 Жауап кілті'}</button></div><div class="diag-list">${qs}</div></div></div><aside class="side-stack"><div class="info-card"><h3>✍️ Мұғалім бағалайды</h3><p class="small-muted" style="margin-bottom:14px">Бұл диагностиканың түсіндіру, дәлелдеу балдары мұғалімнің тексеруін қажет етеді. Сайт нәтижені өзі ойдан шығармайды.</p><form id="diagForm"><label class="small-muted" for="diagScore">${safe(DB.active)} оқушысының нәтижесі (0–20)</label><div class="answer-form" style="margin:10px 0"><input id="diagScore" type="number" min="0" max="20" step="1" value="${score==null?'':score}" class="answer-input" placeholder="Мысалы: 14" required></div><button type="submit" class="btn btn-primary">💾 Нәтижені сақтау</button></form></div><div class="info-card"><h3>📏 Балл қою ережесі</h3><p class="small-muted">1, 2, 5, 7, 8-тапсырмалар – 2 баллдан; 3, 6-тапсырмалар – 3 баллдан; 4-тапсырма – 4 балл.</p><p class="small-muted" style="margin-top:10px">Дұрыс нәтиже және есептеу жолын түсіндіру бөлек ескеріледі. Бірдей рубрика А және Б нұсқаларына қолданылады.</p><div style="margin-top:14px"><button class="btn btn-outline btn-sm" data-action="nav" data-view="teacher">Толық әдістеме →</button></div></div><div class="notice">⚠️ Нақты педагогикалық зерттеу туралы есеп беру үшін тапсырма балына қосымша оқушы жұмысы және мұғалімнің тексеру парағы қажет.</div></aside></div></div>`}
function teacherPage(){const tab=S.teacherTab;const tabs=[['guide','Қолдану нұсқаулығы'],['class','Сынып мониторингі'],['rubric','Бағалау рубрикасы'],['print','Көрнекілік / баспа']].map(([k,v])=>`<button class="${tab===k?'active':''}" data-action="teach-tab" data-tab="${k}">${v}</button>`).join('');let content='';
 if(tab==='guide')content=`<div class="teachers-cols"><div class="panel"><h3>🧭 Авторлық «ҚАЛА» әдісі</h3>${[['Қ','Қарастыр: мәтінді оқы, сұрақты белгіле.'],['А','Анықта: қажет деректер мен өлшемді ажырат.'],['Л','Логикасын құр: тиімді амал мен модельді таңда.'],['А','Ақиқатта: жауапты тексеріп, дәлелде.']].map(([a,b])=>`<div class="teacher-tip"><b>${a}</b><span>${b}</span></div>`).join('')}<div class="notice" style="margin-top:15px">Жауаптарды тексеру ережеге негізделген. Бұл жүйе ЖИ модельдерімен чат жүргізбейді, оқушының түсіндірмесін автоматты бағаламайды.</div></div><div class="panel"><h3>📅 Ұсынылатын 5 апталық цикл</h3>${[['0','Бастапқы диагностика, қиындық картасы'],['1','SMART SHOP + TIME STATION'],['2','MATH BANK + BUILD HOUSE'],['3','SMART ROUTE + DATA PARK'],['4','LOGIC QUEST, қорытынды диагностика, рефлексия']].map(([n,b])=>`<div class="teacher-tip"><b>${n}</b><span>${b}</span></div>`).join('')}</div></div><div class="panel" style="margin-top:19px"><h3>🎬 Байқауда 8–10 минут таныстыру жоспары</h3><div class="teacher-tip"><b>1</b><span><strong>Мәселе:</strong> есепті өмірлік жағдайда қолданудың қиындығы (1 минут).</span></div><div class="teacher-tip"><b>2</b><span><strong>Шешім:</strong> қала картасы мен «ҚАЛА» алгоритмі (2 минут).</span></div><div class="teacher-tip"><b>3</b><span><strong>Демонстрация:</strong> SHOP, ROUTE немесе BANK бөлімін ашып, бір есепті шешу (3 минут).</span></div><div class="teacher-tip"><b>4</b><span><strong>Нәтиже:</strong> шынайы диагностика және бақылау деректерін көрсету (2 минут).</span></div><div class="teacher-tip"><b>5</b><span><strong>Қорытынды:</strong> тарату мүмкіндігі және педагогикалық рефлексия (1–2 минут).</span></div></div>`;
 if(tab==='class'){
 const rows=Object.entries(DB.profiles).map(([code,p])=>{let n=completed(p),a=p.diag?.A,b=p.diag?.B;return `<tr><td>${safe(code)}</td><td>${n} / ${N_QUESTIONS}</td><td>${n*10}</td><td>${a==null?'—':a}</td><td>${b==null?'—':b}</td><td>${a==null||b==null?'—':((b-a)>0?'+':'')+(b-a)}</td></tr>`}).join('');
 content=`<div class="panel"><div class="section-head"><div><h3>📊 Осы құрылғыда енгізілген оқушы кодтары</h3><p>Код таңдап, миссия орындатуға немесе жеке нәтижесін енгізуге болады.</p></div><button class="btn btn-primary btn-sm" data-action="profile">+ Оқушы кодын қосу</button></div><div class="table-wrap"><table><thead><tr><th>Код</th><th>Дұрыс жауап</th><th>Ұпай</th><th>А /20</th><th>Б /20</th><th>Өзгеріс</th></tr></thead><tbody>${rows}</tbody></table></div><div class="hero-actions" style="margin-top:20px"><button class="btn btn-ghost" data-action="csv">⬇ CSV нәтижелерін жүктеу</button><button class="btn btn-outline" data-action="print-report">🖨️ Белсенді оқушы есебі</button><button class="btn btn-danger btn-sm" data-action="reset">🗑️ Белсенді оқушы дерегін тазалау</button></div></div><div class="notice" style="margin-top:17px">🔐 Оқушылардың толық аты-жөнін енгізбеңіз. Мәлімет басқа компьютерлерге автоматты көшірілмейді және серверге жіберілмейді. CSV – мұғалімнің сақтық көшірмесі.</div>`;
 }
 if(tab==='rubric'){
 const rubrics=[['understanding','Мәселені түсіну','Не белгілі, не сұралғанын айтады'],['model','Модель / жоспар','Сызба, кесте немесе өрнек құрады'],['calculation','Есептеудің дұрыстығы','Амалдарды дұрыс орындайды'],['explanation','Дәлелдеу','Шешімін түсіндіреді'],['checking','Тексеру','Жауаптың өмірге сәйкестігін тексереді']];
 const fields=rubrics.map(([id,label,sub])=>`<div class="rubric-item"><div><strong>${label}</strong><small>${sub}</small></div><select data-rubric="${id}" aria-label="${label}">${[0,1,2].map(n=>`<option value="${n}" ${Number(profile().rubric?.[id]||0)===n?'selected':''}>${n} балл</option>`).join('')}</select></div>`).join('');const sum=rubrics.reduce((s,[id])=>s+Number(profile().rubric?.[id]||0),0);
 content=`<div class="teachers-cols"><div class="panel"><h3>📋 Мұғалімнің қалыптастырушы бағалауы</h3><p class="small-muted" style="margin:7px 0 17px">Әр критерий 0–2 баллмен есептеледі. Бұл 20 балдық диагностикадан бөлек.</p>${fields}<div style="margin-top:15px"><span class="tag">Жиыны: <span id="rubricTotal" style="margin-left:5px">${sum}</span> / 10</span></div></div><div class="panel"><h3>✅ Дескриптор</h3><div class="teacher-tip"><b>0</b><span>Дағды тапсырмада байқалмады немесе қате қолданылды.</span></div><div class="teacher-tip"><b>1</b><span>Ішінара орындалды; мұғалім қолдауы қажет.</span></div><div class="teacher-tip"><b>2</b><span>Өздігінен, түсінікті әрі дәл орындалды.</span></div><p class="small-muted" style="margin:17px 0">Белсенді код: ${safe(DB.active)}</p><button class="btn btn-primary" data-action="rubric-save">💾 Бағалауды сақтау</button></div></div>`;
 }
 if(tab==='print')content=`<div class="teachers-cols"><div class="panel"><h3>🖨️ 21 миссия – қағаз тапсырма жинағы</h3><p class="small-muted" style="margin:10px 0 18px">7 бөлімдегі A · B · C деңгейінің барлық мәтінді есептері жеке-жеке баспаға шығады. Оқушы жауаптарды қағазға жазады.</p><button class="btn btn-primary" data-action="print-missions">Миссия парақтарын шығару</button></div><div class="panel"><h3>📝 20 балдық диагностика парақтары</h3><p class="small-muted" style="margin:10px 0 18px">Бастапқы және қорытынды жұмыс нұсқаларын жауап кілтінсіз шығарып алуға болады.</p><button class="btn btn-outline" data-action="print-diag">Таңдалған нұсқаны шығару</button></div></div><div class="notice" style="margin-top:18px">Басып шығару терезесінде A4 (тік) форматты және «Фондық графиканы басып шығару» параметрін қажетіне қарай таңдаңыз.</div>`;
 return `<div class="container section"><div class="page-head"><div><span class="eyetag">👩‍🏫 МҰҒАЛІМ ПАНЕЛІ</span><h2>Әдістемелік кабинет</h2><p class="subline">Авторлық жоба · оқытуды жоспарлау · бағалау · нәтиже</p></div><button class="btn btn-outline btn-sm" data-action="nav" data-view="home">← Қалаға қайту</button></div><div class="tabs">${tabs}</div>${content}</div>`;
}
function render(){renderHeader(); $('root').innerHTML= S.view==='home'?home():S.view==='mission'?zonePage():S.view==='progress'?progressPage():S.view==='diagnostic'?diagnosticPage():teacherPage();}
function standardAnswer(t,raw){let x=String(raw||'').trim().toLocaleLowerCase('kk-KZ'),expected=String(t.a).trim().toLocaleLowerCase('kk-KZ');if(t.type==='choice')return x===expected;if(t.type==='time') {let mt=x.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})$/);if(!mt)return false;let norm=`${Number(mt[1])}:${String(Number(mt[2])).padStart(2,'0')}`,ex=expected.replace(/^0(?=\d:)/,'');return norm===ex;}const cleanup=v=>v.replace(/[\s\u00a0]/g,'').replace(',','.').replace(/теңге|тг|минут|м²|м2|м|бала|адам|орын|бөлік|апта|төсем|оқушы/gi,'');let q=cleanup(x),a=cleanup(expected);return q!==''&&Number.isFinite(Number(q))&&Number(q)===Number(a)}
function submitAnswer(){const t=currentMission().tasks[S.taskIndex];const inp=$('answerInput');if(!inp)return;const raw=inp.value.trim();if(!raw){toast('Алдымен жауапты енгіз немесе нұсқаны таңда.');return;}const p=profile();p.attempts=p.attempts||{};p.attempts[t.id]=(p.attempts[t.id]||0)+1;const okay=standardAnswer(t,raw);if(okay){if(!doneTask(t.id)){p.progress[t.id]={ok:true,tries:p.attempts[t.id],at:new Date().toISOString()};save();toast('+10 ұпай! Дұрыс жауап 🎉');}S.feedback={kind:'correct'};}else{S.feedback={kind:'wrong'};save();}render();let f=$('answerInput');if(f&&S.feedback.kind==='wrong'&&t.type!=='choice')f.focus();}
function selectLevel(l){S.level=l;S.taskIndex=firstOpen(S.zone,l);S.feedback=null;S.hint=false;S.selected='';S.completion=false;render()}
function nextTask(){const m=currentMission();S.feedback=null;S.hint=false;S.selected='';if(S.taskIndex<m.tasks.length-1){S.taskIndex++;}else if(isDoneMission(m)){S.completion=true;}else{S.taskIndex=firstOpen(S.zone,S.level)}render()}
function gotoNextLevel(){const ls=['A','B','C'],ix=ls.indexOf(S.level);if(ix<2)selectLevel(ls[ix+1]);else nav('progress')}
function profileModal(){let content=Object.keys(DB.profiles).map(code=>`<button type="button" data-action="switch-profile" data-code="${safe(code)}" class="${DB.active===code?'active':''}"><span>👩‍🎓 ${safe(code)}</span><span>${completed(DB.profiles[code])}/${N_QUESTIONS}</span></button>`).join('');$('profileModal').innerHTML=`<div class="modal"><h2>👩‍🎓 Оқушы кодтары</h2><p>Нақты аты-жөнді енгізбеңіз. Бір компьютерде бірнеше оқушының жеке нәтижесін жүргізуге болады.</p><div class="profile-list">${content}</div><form id="profileForm"><label for="newCode" class="small-muted">Жаңа код (мысалы: O-02)</label><input id="newCode" placeholder="O-02" maxlength="16" pattern="[A-Za-z0-9_-]{2,16}" required><button type="submit" class="btn btn-primary" style="width:100%">+ Жаңа оқушы кодын қосу</button></form><div class="modal-actions"><button class="btn btn-muted" data-action="close-modal">Жабу</button></div></div>`;$('profileModal').classList.remove('hidden');}
function closeModal(){$('profileModal').classList.add('hidden')}
function addProfile(){let val=$('newCode').value.trim().toUpperCase();if(!/^[A-Z0-9_-]{2,16}$/.test(val)){toast('Кодты латын әріптерімен, санмен жазыңыз: O-02');return}if(DB.profiles[val]){toast('Бұл код бұрыннан бар.');return;}DB.profiles[val]=blankProfile();DB.active=val;save();closeModal();render();toast(`${val} коды ашылды`)}
function downloadCsv(){const headers=['Оқушы коды','Орындалған тапсырма /42','Ұпай /420','Диагностика А /20','Диагностика Б /20','Өзгеріс /20',...Object.values(DATA.missions).flat().map(m=>m.id)];const arr=[headers];Object.entries(DB.profiles).forEach(([code,p])=>{let pre=p.diag?.A,post=p.diag?.B;arr.push([code,completed(p),earned(p),pre??'',post??'',pre!=null&&post!=null?post-pre:'',...Object.values(DATA.missions).flat().map(m=>m.tasks.filter(t=>p.progress?.[t.id]?.ok).length+'/2')])});const escape=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+arr.map(row=>row.map(escape).join(';')).join('\r\n');let file=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='MATH_CITY_synyptyn_monitoringi.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast('CSV файлы сақталды.');}
function printContent(html){$('printArea').innerHTML=html;setTimeout(()=>window.print(),120)}
function printDiagnostics(){const d=DATA.diag.find(x=>x.code===S.diagCode);const rows=d.qs.map((r,i)=>`<div class="print-q"><strong>${i+1}. ${safe(r[0])} (${r[2]} балл)</strong><p>${safe(r[1])}</p><div class="line"></div><div class="line"></div></div>`).join('');printContent(`<div class="print-title">MATH CITY · ${d.code} НҰСҚАСЫ</div><h2>${safe(d.title)}</h2><p>4-сынып математикасы · Жалпы балл: 20</p><p>Оқушы коды: ____________________ &nbsp; Сыныбы: ______ &nbsp; Күні: __________</p>${rows}<p class="print-note">Есептеу жолын, өлшем бірліктерін және түсіндірмені көрсет. Тапсырманы мұғалім бағалайды.</p>`)}
function printMissions(){let html=`<div class="print-title">MATH CITY · 21 АВТОРЛЫҚ МИССИЯ</div><p>4-сынып математикасы. Әр аймақтың 3 деңгейі бар. Жауапты дәлелде.</p>`;Object.entries(DATA.missions).forEach(([id,ms])=>{let a=AREA[id];html+=`<h2>${safe(a.title)} · ${safe(a.sub)}</h2>`;for(let m of ms){html+=`<div class="print-q"><strong>${m.level} деңгейі · ${safe(m.title)}</strong><p>${safe(m.story)}</p>${m.tasks.map((t,i)=>`<p>${i+1}) ${safe(t.q)} ${t.unit?`(${safe(t.unit)})`:''}</p><div class="line"></div>`).join('')}</div>`}});printContent(html)}
function printReport(){let p=profile(),pre=p.diag?.A,post=p.diag?.B;let rows=DATA.areas.filter(a=>a.id!=='progress').map(a=>`<tr><td>${a.title}</td><td>${DATA.missions[a.id].flatMap(m=>m.tasks).filter(t=>p.progress?.[t.id]?.ok).length} / 6</td></tr>`).join('');printContent(`<div class="print-title">MATH CITY · ЖЕКЕ ЖЕТІСТІК КАРТАСЫ</div><p><strong>Оқушы коды:</strong> ${safe(DB.active)} &nbsp; <strong>Күні:</strong> ${new Date().toLocaleDateString('kk-KZ')}</p><p><strong>Орындалған тапсырма:</strong> ${completed(p)} / ${N_QUESTIONS}; &nbsp; <strong>Ұпай:</strong> ${earned(p)} / ${N_QUESTIONS*10}</p><h2>Қалалық аймақтар</h2><table><thead><tr><th>Аймақ</th><th>Дұрыс тапсырма</th></tr></thead><tbody>${rows}</tbody></table><h2>Диагностика</h2><p>Бастапқы (А): ${pre==null?'енгізілмеді':pre+'/20'}; Қорытынды (Б): ${post==null?'енгізілмеді':post+'/20'}; Өзгеріс: ${pre!=null&&post!=null?(post-pre)+' балл':'—'}</p><h2>Мұғалімнің ескертпесі</h2><div class="line"></div><div class="line"></div><div class="line"></div><p class="print-note">Браузердегі автоматты тексеру оқушының түсіндіруін бағаламайды. Тұжырымды мұғалім нақты жұмыс үлгілерімен дәлелдейді.</p>`)}
function saveRubric(){let rubric={};document.querySelectorAll('[data-rubric]').forEach(s=>rubric[s.dataset.rubric]=Number(s.value));profile().rubric=rubric;save();toast('10 балдық рубрика сақталды');render()}
function resetProfile(){if(!confirm(`${DB.active} кодының барлық нәтижесін тазалау керек пе? Бұл әрекетті кері қайтару мүмкін емес.`))return;DB.profiles[DB.active]=blankProfile();save();render();toast('Белсенді оқушының деректері тазаланды')}
function start(){for(const a of DATA.areas){if(a.id==='progress')continue;const m=DATA.missions[a.id].find(m=>!m.tasks.every(t=>doneTask(t.id)));if(m){openZone(a.id,m.level);return;}}nav('progress')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
 if(act==='nav'){const v=b.dataset.view;if(v==='mission')openZone(S.zone,S.level);else nav(v);}
 else if(act==='start')start();else if(act==='open-zone')openZone(b.dataset.zone);
 else if(act==='level')selectLevel(b.dataset.level);else if(act==='task'){S.taskIndex=Number(b.dataset.index);S.feedback=null;S.hint=false;S.selected='';S.completion=false;render()}
 else if(act==='hint'){S.hint=!S.hint;render()}
 else if(act==='choice'){S.selected=b.dataset.value;S.feedback=null;render()}
 else if(act==='next-task')nextTask();else if(act==='next-level')gotoNextLevel();else if(act==='replay'){S.taskIndex=0;S.completion=false;S.feedback=null;render()}
 else if(act==='profile')profileModal();else if(act==='close-modal')closeModal();else if(act==='switch-profile'){DB.active=b.dataset.code;save();closeModal();render();toast(`Белсенді код: ${DB.active}`)}
 else if(act==='mobilemenu'){$('mobileNav').classList.toggle('open');b.setAttribute('aria-expanded',$('mobileNav').classList.contains('open'))}
 else if(act==='diag-switch'){S.diagCode=b.dataset.code;S.diagKey=false;render()}else if(act==='diag-key'){S.diagKey=!S.diagKey;render()}
 else if(act==='teach-tab'){S.teacherTab=b.dataset.tab;render()}
 else if(act==='csv')downloadCsv();else if(act==='print-diag')printDiagnostics();else if(act==='print-missions')printMissions();else if(act==='print-report')printReport();else if(act==='reset')resetProfile();else if(act==='rubric-save')saveRubric();
});
document.addEventListener('submit',e=>{if(['answerForm','profileForm','diagForm'].includes(e.target.id)){e.preventDefault();if(e.target.id==='answerForm')submitAnswer();else if(e.target.id==='profileForm')addProfile();else if(e.target.id==='diagForm'){const num=Number($('diagScore').value);if(!Number.isInteger(num)||num<0||num>20){toast('0 мен 20 аралығында бүтін балл енгізіңіз.');return;}profile().diag[S.diagCode]=num;save();render();toast('Диагностика нәтижесі сақталды.')}}});
document.addEventListener('change',e=>{if(e.target.dataset.action==='reflect'){profile().reflect[e.target.dataset.key]=e.target.checked;save();}if(e.target.dataset.rubric){let sum=Array.from(document.querySelectorAll('[data-rubric]')).reduce((n,s)=>n+Number(s.value),0);$('rubricTotal').textContent=sum}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('profileModal').classList.contains('hidden'))closeModal()});
window.addEventListener('afterprint',()=>{$('printArea').innerHTML=''})
render();
</script>
</body></html>
